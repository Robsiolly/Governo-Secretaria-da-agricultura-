<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  
  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#334155" stroke-width="8" opacity="0.5" />
  
  <!-- Shield Badge -->
  <path d="M256 64 L416 112 V240 C416 346 348 436 256 464 C164 436 96 346 96 240 V112 Z" fill="#1e293b" stroke="#475569" stroke-width="12" />
  
  <!-- Left Side: Wheat (Agriculture) -->
  <g transform="translate(-20, 0)">
    <path d="M210 360 C180 300 180 200 240 140" stroke="url(#emeraldGrad)" stroke-width="14" stroke-linecap="round" fill="none" />
    <circle cx="200" cy="280" r="16" fill="url(#emeraldGrad)" />
    <circle cx="180" cy="240" r="16" fill="url(#emeraldGrad)" />
    <circle cx="170" cy="200" r="16" fill="url(#emeraldGrad)" />
    <circle cx="175" cy="160" r="16" fill="url(#emeraldGrad)" />
  </g>
  
  <!-- Right Side: Compass (Turismo) -->
  <g transform="translate(20, 0)">
    <circle cx="300" cy="256" r="64" fill="none" stroke="url(#amberGrad)" stroke-width="12" />
    <polygon points="300,208 316,256 300,248 284,256" fill="url(#amberGrad)" />
    <polygon points="300,304 316,256 300,264 284,256" fill="#fef3c7" />
  </g>

  <!-- Crown / Star -->
  <polygon points="256,120 266,144 292,144 271,160 279,184 256,168 233,184 241,160 220,144 246,144" fill="#fbbf24" />
</svg>
